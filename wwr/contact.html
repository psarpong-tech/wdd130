<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rapid Rush Adventure</title>
    <meta name="description"
      content="Contact Rapid Rush Adventure for rafting reservations, general inquiries, and website feedback.">
    <meta name="author" content="Priscilla Gyasiwaa Sarpong">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/wwr-logo.png" alt="WWR Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="company-info">

            <h2>Rapid Rush Adventure</h2>

            <p>Atta Mills Road</p>
            <p>Goaso, Ghana</p>
            <p>+233 (0) 25 685 2276</p>
            <p>info@rapidrushadventure.com</p>

            <div class="contact-content">

                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3961.824663042112!2d-2.5095575000000405!3d6.791178500000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfc4cb7ca09ef78f%3A0x3129433b0fc1a055!2sAtta%20Mills%20Road%20Goaso!5e0!3m2!1sen!2sgh!4v1785533087741!5m2!1sen!2sgh"
                      loading="lazy" allowfullscreen
                      referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>
                </div>

                <div class="contact-form">

                    <form action="#" method="post">

                        <div class="form-row">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" required>
                        </div>

                        <div class="form-row">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-row">
                            <label>Message<br>Purpose</label>

                            <fieldset>

                                <label>
                                    <input type="radio" name="purpose" value="general" required>
                                    General Inquiry
                                </label>

                                <label>
                                    <input type="radio" name="purpose" value="reservation">
                                    Reservation Question
                                </label>

                                <label>
                                    <input type="radio" name="purpose" value="website">
                                    Website Suggestion
                                </label>

                            </fieldset>

                        </div>

                        <div class="form-row">
                            <label for="message">Message</label>

                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>

                        <div class="form-row">

                            <div></div>

                            <label class="newsletter">
                                <input type="checkbox" name="newsletter">
                                Please subscribe me to the monthly newsletter
                            </label>

                        </div>

                        <div class="form-row">

                            <div></div>

                            <button type="submit">Get in Touch!</button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.webp" alt="General Manager">
                    <figcaption>
                        <strong>Emelia Arthur</strong><br>
                        General Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.webp" alt="Lead River Guide">
                    <figcaption>
                        <strong>Pius Benson</strong><br>
                        Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.webp" alt="Customer Service Representative">
                    <figcaption>
                        <strong>Precious Ansah</strong><br>
                        Customer Service Representative
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>©️2026 🌊 Rapid Rush Adventure 🌊 Priscilla Gyasiwaa Sarpong 🌊</p>

        <nav class="socialmedia">

            <a href="https://www.facebook.com/nanaakosuaesi1">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://www.instagram.com/nanesiako">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://www.youtube.com/nanaehsiako">
                <img src="images/youtube.svg" alt="YouTube">
            </a>

        </nav>

    </footer>

</body>

</html>
